repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: uvx ruff check --fix --exit-non-zero-on-fix --no-cache
        language: system
        types_or: [python, pyi]
        files: ^(src/flextype|tests/flextype)/.*\.py$

      - id: ruff-format
        name: ruff format
        entry: uv run --locked --group lint ruff format
        language: system
        types_or: [python, pyi]
        files: ^(src/flextype|tests/flextype)/.*\.py$

      - id: ty-check
        name: ty check
        entry: uv run --locked --group lint ty check
        language: system
        pass_filenames: false
