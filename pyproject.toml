[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "flextype"
version = "0.2.0"
description = "Making types flexible."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12.0"
dependencies = [
    "typing-extensions>=4.7.0; python_version < '3.13'",
]
authors = [
    { name = "Clemens Damke", email = "clemens@cortys.de" },
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: Unix",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
]

[project.urls]
source = "https://github.com/Cortys/flextype"
tracker = "https://github.com/Cortys/flextype/issues"

[tool.setuptools.packages.find]
where = ["./src"]
include = ["flextype", "flextype.*"]

[dependency-groups]
lint = [
    "ruff>=0.17.1",
    "ty>=0.0.89",
]
test = [
    "pytest>=8.0",
]
dev = [
    { include-group = "lint" },
    { include-group = "test" },
    "prek>=0.4.5",
]

[tool.ruff]
line-length = 120
target-version = "py312"
output-format = "full"
exclude = [
    ".eggs",
    ".git",
    ".pytest_cache",
    ".ruff_cache",
    ".ty",
    ".venv",
    ".vscode",
    "__pypackages__",
    "build",
    "dist",
    "venv",
]

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "COM812",
    "CPY001",
    "FBT",
    "FIX002",
    "PLR0913",
    "PLR2004",
    "RET504",
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = [
    "ANN001",
    "ANN201",
    "ANN202",
    "C901",
    "D100",
    "D101",
    "D102",
    "D103",
    "D404",
    "FBT001",
    "INP001",
    "N803",
    "PLR2004",
    "S101",
    "TCH",
]
"__init__.py" = [
    "I002",
    "PLC0414",
]

[tool.ruff.lint.mccabe]
max-complexity = 15

[tool.ruff.lint.isort]
known-first-party = ["flextype"]
force-sort-within-sections = true
combine-as-imports = true
force-single-line = false
no-lines-before = ["future"]
required-imports = ["from __future__ import annotations"]
extra-standard-library = ["typing_extensions"]

[tool.pytest.ini_options]
testpaths = ["tests/flextype"]
minversion = "8.0"
pythonpath = ["src"]
addopts = [
    "--import-mode=importlib",
]

[tool.ty.src]
include = ["src/flextype", "tests/flextype"]

[[tool.ty.overrides]]
include = ["tests/flextype/**"]

[tool.ty.overrides.rules]
unresolved-import = "ignore"
